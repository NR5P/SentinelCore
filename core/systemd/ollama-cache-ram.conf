# Drop-in for Ollama's own unit: /etc/systemd/system/ollama.service.d/cache-ram.conf
#
# Ollama runs llama.cpp's llama-server, whose RAM prompt cache defaults to 8192 MiB. Every
# camera analysis carries a different image, and gemma3's sliding-window attention can't reuse
# a cached prompt anyway, so the cache never hits - it just grows ~400 MiB per alert until the
# model (~4 GB) plus a full cache (~8 GB) runs a 16 GB box out of memory every few hours.
# Ollama passes its environment through to llama-server, so this turns the cache off.
[Service]
Environment="LLAMA_ARG_CACHE_RAM=0"
