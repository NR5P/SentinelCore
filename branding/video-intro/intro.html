<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#010306;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// Deterministic intro: render(t) draws the frame at time t seconds. Driven frame-by-frame over CDP.
const W = 1280, H = 720, BG = '#010306', GREEN = '#3dff8a', CYAN = '#4fd8ff';
const out = document.getElementById('c').getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const ctx = buf.getContext('2d');
const src = new Image();
let logo, red, cyan, grain = [];

const rnd = (a, b = 0) => { const x = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return x - Math.floor(x); };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, x) => a + (b - a) * x;

function channel(img, color) {
  const c = document.createElement('canvas'); c.width = c.height = 1024;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'multiply'; g.fillStyle = color; g.fillRect(0, 0, 1024, 1024);
  // multiply fills transparent pixels with solid color; restore the feathered alpha
  g.globalCompositeOperation = 'destination-in'; g.drawImage(logo, 0, 0);
  return c;
}

window.ready = new Promise(res => {
  src.onload = async () => {
    // feather the square icon so its background edge never shows against the scene
    logo = document.createElement('canvas'); logo.width = logo.height = 1024;
    const lg = logo.getContext('2d');
    lg.drawImage(src, 0, 0);
    const m = lg.createRadialGradient(512, 512, 395, 512, 512, 505);
    m.addColorStop(0, 'rgba(0,0,0,1)'); m.addColorStop(1, 'rgba(0,0,0,0)');
    lg.globalCompositeOperation = 'destination-in'; lg.fillStyle = m; lg.fillRect(0, 0, 1024, 1024);
    red = channel(src, '#ff0000'); cyan = channel(src, '#00ffff');
    for (let k = 0; k < 6; k++) {
      const c = document.createElement('canvas'); c.width = W / 2; c.height = H / 2;
      const g = c.getContext('2d'), d = g.createImageData(W / 2, H / 2);
      for (let i = 0; i < d.data.length; i += 4) { const v = rnd(i, k) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
      g.putImageData(d, 0, 0); grain.push(c);
    }
    await document.fonts.load('700 80px "Avenir Next"');
    await document.fonts.load('500 16px Menlo');
    res(true);
  };
  src.src = '../SentinelCoreAppIcon-1024.png';
});

function brackets(t) {
  const p = easeOut(prog(t, 0.25, 0.85)), m = 38, L = 70 * p;
  ctx.strokeStyle = GREEN; ctx.globalAlpha = 0.85 * p; ctx.lineWidth = 2;
  for (const [x, y, sx, sy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) {
    ctx.beginPath(); ctx.moveTo(x, y + sy * L); ctx.lineTo(x, y); ctx.lineTo(x + sx * L, y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function typed(s, t, start, cps = 40) { return s.slice(0, Math.max(0, Math.floor((t - start) * cps))); }

function hud(t, fade) {
  ctx.font = '500 14px Menlo'; ctx.textBaseline = 'middle';
  const a = fade * 0.8;
  ctx.globalAlpha = a; ctx.fillStyle = GREEN;
  ctx.textAlign = 'left';
  // blinking REC dot
  if (t > 0.5 && Math.floor(t * 2.2) % 2 === 0) { ctx.fillStyle = '#ff3b3b'; ctx.beginPath(); ctx.arc(66, 68, 5, 0, 7); ctx.fill(); ctx.fillStyle = GREEN; }
  ctx.fillText(typed('CAM 01  REC', t, 0.5), 80, 68);
  const low = a * (1 - prog(t, 3.0, 3.5)); // bottom lines clear out before the tagline arrives
  ctx.globalAlpha = low;
  ctx.fillText(typed('LOCAL AI  //  ONLINE', t, 0.75), 60, H - 66);
  ctx.globalAlpha = a;
  ctx.textAlign = 'right';
  const f = Math.floor(t * 29.97);
  const tc = `00:00:${String(Math.floor(f / 30)).padStart(2, '0')}:${String(f % 30).padStart(2, '0')}`;
  if (t > 0.6) ctx.fillText(tc, W - 60, 68);
  ctx.globalAlpha = low;
  ctx.fillText(typed('NO CLOUD  //  SELF-HOSTED', t, 0.95), W - 60, H - 66);
  ctx.globalAlpha = 1;
}

function grid(t) {
  const a = 0.07 * easeOut(prog(t, 0, 1));
  ctx.fillStyle = GREEN; ctx.globalAlpha = a;
  for (let x = 20; x < W; x += 40) for (let y = 20; y < H; y += 40) ctx.fillRect(x, y, 1.5, 1.5);
  ctx.globalAlpha = 1;
}

function scanline(t, a, b) {
  if (t < a || t > b) return;
  const y = lerp(-40, H + 40, easeInOut(prog(t, a, b)));
  const g = ctx.createLinearGradient(0, y - 120, 0, y);
  g.addColorStop(0, 'rgba(61,255,138,0)'); g.addColorStop(1, 'rgba(61,255,138,0.10)');
  ctx.fillStyle = g; ctx.fillRect(0, y - 120, W, 120);
  ctx.fillStyle = 'rgba(160,255,200,0.75)'; ctx.fillRect(0, y - 1, W, 2);
}

function particles(t) {
  ctx.fillStyle = GREEN;
  for (let i = 0; i < 70; i++) {
    const x = rnd(i, 1) * W, sp = 12 + rnd(i, 2) * 30;
    const y = (rnd(i, 3) * (H + 40) - t * sp + H * 4) % (H + 40) - 20;
    ctx.globalAlpha = (0.15 + rnd(i, 4) * 0.35) * prog(t, 0.2, 1.5);
    const s = 1 + rnd(i, 5) * 1.8; ctx.fillRect(x, y, s, s);
  }
  ctx.globalAlpha = 1;
}

function reticle(t, cx, cy, alpha) {
  if (alpha <= 0) return;
  const p = easeOut(prog(t, 0.55, 1.4));
  ctx.save(); ctx.translate(cx, cy); ctx.globalAlpha = alpha; ctx.strokeStyle = GREEN; ctx.lineWidth = 2;
  // outer dashed ring, rotating
  ctx.rotate(t * 0.6);
  for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(0, 0, 250, k * Math.PI / 2 + 0.15, k * Math.PI / 2 + 0.15 + 1.2 * p); ctx.stroke(); }
  ctx.rotate(-t * 1.5);
  ctx.globalAlpha = alpha * 0.5; ctx.lineWidth = 1;
  ctx.setLineDash([3, 9]); ctx.beginPath(); ctx.arc(0, 0, 222, 0, Math.PI * 2 * p); ctx.stroke(); ctx.setLineDash([]);
  // tick marks
  ctx.globalAlpha = alpha * 0.8; ctx.lineWidth = 2;
  for (let k = 0; k < 36; k++) { if (k / 36 > p) break; const r1 = 268, r2 = k % 9 === 0 ? 290 : 276; const an = k * Math.PI / 18; ctx.beginPath(); ctx.moveTo(Math.cos(an) * r1, Math.sin(an) * r1); ctx.lineTo(Math.cos(an) * r2, Math.sin(an) * r2); ctx.stroke(); }
  ctx.restore();
  // crosshair lines out to the edges
  ctx.globalAlpha = alpha * 0.35 * p; ctx.strokeStyle = GREEN; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx - 300 - 200 * p, cy); ctx.lineTo(cx - 300, cy); ctx.moveTo(cx + 300, cy); ctx.lineTo(cx + 300 + 200 * p, cy); ctx.stroke();
  ctx.globalAlpha = 1;
  // label
  if (t > 0.7 && t < 1.55) {
    ctx.font = '500 13px Menlo'; ctx.fillStyle = GREEN; ctx.textAlign = 'center'; ctx.globalAlpha = alpha * (Math.floor(t * 8) % 2 ? 0.9 : 0.5);
    ctx.fillText('SCANNING' + '.'.repeat(Math.floor(t * 6) % 4), cx, cy + 320); ctx.globalAlpha = 1;
  }
}

function drawLogo(t, cx, cy, size, alpha, glitch) {
  if (alpha <= 0) return;
  const x = cx - size / 2, y = cy - size / 2;
  // glow halo
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.filter = 'blur(28px)'; ctx.globalAlpha = alpha * (0.35 + 0.12 * Math.sin(t * 3.2));
  ctx.drawImage(logo, x, y, size, size);
  ctx.filter = 'none'; ctx.restore();
  if (glitch > 0.01) {
    // horizontal slice displacement + RGB split
    const slices = 18, sh = size / slices, split = 14 * glitch;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = alpha;
    for (let i = 0; i < slices; i++) {
      const seed = Math.floor(t * 24);
      const off = (rnd(i, seed) - 0.5) * 90 * glitch * (rnd(i + 7, seed) > 0.55 ? 1 : 0.15);
      const sy = i * 1024 / slices, sH = 1024 / slices;
      ctx.drawImage(red, 0, sy, 1024, sH, x + off - split, y + i * sh, size, sh);
      ctx.drawImage(cyan, 0, sy, 1024, sH, x + off + split, y + i * sh, size, sh);
    }
    ctx.restore();
  } else {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = alpha;
    ctx.drawImage(logo, x, y, size, size); ctx.restore();
  }
}

function flare(t, cx, cy, at) {
  const p = prog(t, at, at + 1.1); if (p <= 0 || p >= 1) return;
  const a = Math.pow(1 - p, 2);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  let g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 160);
  g.addColorStop(0, `rgba(220,255,240,${a})`); g.addColorStop(0.2, `rgba(80,255,170,${0.5 * a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(cx - 160, cy - 160, 320, 320);
  // anamorphic streak
  const sw = 900 * (0.6 + 0.4 * p);
  g = ctx.createLinearGradient(cx - sw, 0, cx + sw, 0);
  g.addColorStop(0, 'rgba(79,216,255,0)'); g.addColorStop(0.5, `rgba(170,240,255,${0.9 * a})`); g.addColorStop(1, 'rgba(79,216,255,0)');
  ctx.fillStyle = g; ctx.fillRect(cx - sw, cy - 2, sw * 2, 4);
  ctx.globalAlpha = 0.35 * a; ctx.fillRect(cx - sw, cy - 10, sw * 2, 20);
  ctx.restore();
}

function shockwave(t, cx, cy, at) {
  const p = prog(t, at, at + 0.9); if (p <= 0 || p >= 1) return;
  const r = lerp(170, 780, easeOut(p));
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = `rgba(61,255,138,${0.8 * (1 - p)})`; ctx.lineWidth = 3 + 10 * (1 - p);
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
  ctx.strokeStyle = `rgba(79,216,255,${0.4 * (1 - p)})`; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.82, 0, 7); ctx.stroke();
  ctx.restore();
}

const TITLE = 'SENTINEL CORE', GLYPHS = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&@$<>/\\';
function title(t, cy) {
  const start = 3.15; if (t < start) return;
  ctx.font = '700 84px "Avenir Next"'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const track = 16;
  const widths = [...TITLE].map(ch => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + track * (TITLE.length - 1);
  let x = W / 2 - total / 2;
  const fadeIn = easeOut(prog(t, start, start + 0.25));
  [...TITLE].forEach((ch, i) => {
    const lockAt = start + 0.2 + i * 0.065;
    const appearAt = start + i * 0.03;
    if (t >= appearAt && ch !== ' ') {
      const locked = t >= lockAt;
      const shown = locked ? ch : GLYPHS[Math.floor(rnd(i, Math.floor(t * 30)) * GLYPHS.length)];
      if (locked) {
        const flash = 1 - prog(t, lockAt, lockAt + 0.25);
        ctx.save(); ctx.shadowColor = GREEN; ctx.shadowBlur = 18 + 30 * flash;
        ctx.fillStyle = flash > 0 ? `rgb(${lerp(255, 160, flash)},255,${lerp(255, 200, flash)})` : '#f2fff7';
        ctx.globalAlpha = fadeIn; ctx.fillText(shown, x, cy); ctx.restore();
      } else {
        ctx.fillStyle = GREEN; ctx.globalAlpha = 0.75 * fadeIn; ctx.fillText(shown, x, cy); ctx.globalAlpha = 1;
      }
    }
    x += widths[i] + track;
  });
  // underline sweeping out from the center
  const up = easeOut(prog(t, 4.05, 4.6));
  if (up > 0) {
    const w = 560 * up, g = ctx.createLinearGradient(W / 2 - w, 0, W / 2 + w, 0);
    g.addColorStop(0, 'rgba(61,255,138,0)'); g.addColorStop(0.5, 'rgba(61,255,138,0.95)'); g.addColorStop(1, 'rgba(61,255,138,0)');
    ctx.fillStyle = g; ctx.fillRect(W / 2 - w, cy + 56, w * 2, 2);
  }
  // tagline
  const tp = easeOut(prog(t, 4.45, 5.0));
  if (tp > 0) {
    ctx.font = '500 17px Menlo'; ctx.textAlign = 'center'; ctx.fillStyle = '#bfeed3';
    ctx.globalAlpha = tp; ctx.letterSpacing = '6px';
    ctx.fillText('LOCAL AI CAMERA SECURITY  ·  YOUR SERVER, YOUR RULES', W / 2 + 3, cy + 92 + 10 * (1 - tp));
    ctx.letterSpacing = '0px'; ctx.globalAlpha = 1;
  }
}

function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

window.render = function (t) {
  const END = 7.2;
  ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);

  // background glow behind the logo
  const IMPACT = 2.35;
  const move = easeInOut(prog(t, 2.85, 3.55));
  const cx = W / 2, cy = lerp(H / 2, 262, move);
  const bgGlow = 0.10 + 0.25 * prog(t, 1.3, IMPACT) - 0.1 * move;
  let g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 520);
  g.addColorStop(0, `rgba(30,140,80,${bgGlow})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  grid(t); particles(t);
  scanline(t, 0.15, 1.35); scanline(t, 5.1, 6.4);
  reticle(t, cx, cy, 1 - prog(t, 2.6, 3.2));

  // logo: glitches in, slams to size on impact, then rises to make room for the title
  const appear = prog(t, 1.25, IMPACT);
  const size = lerp(lerp(470, 380, easeOut(appear)), 300, move) * (t > IMPACT ? 1 + 0.06 * Math.exp(-(t - IMPACT) * 9) : 1);
  const glitch = t < IMPACT ? (1 - appear) * 0.9 + 0.25 * (rnd(Math.floor(t * 12)) > 0.6 ? 1 : 0) : 0.6 * Math.exp(-(t - IMPACT) * 14);
  drawLogo(t, cx, cy, size, easeOut(appear), glitch);
  shockwave(t, cx, cy, IMPACT);
  flare(t, cx, cy, IMPACT);
  title(t, 548);
  hud(t, 1);

  // impact flash
  const fl = t > IMPACT ? Math.exp(-(t - IMPACT) * 10) : 0;
  if (fl > 0.01) { ctx.fillStyle = `rgba(190,255,220,${0.45 * fl})`; ctx.fillRect(0, 0, W, H); }
  vignette();
  // film grain
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.09;
  ctx.drawImage(grain[Math.floor(t * 30) % grain.length], 0, 0, W, H);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // composite to screen with camera shake + whole-frame glitch at impact and on the way out
  const shake = t > IMPACT ? 9 * Math.exp(-(t - IMPACT) * 8) : 0;
  const sx = (rnd(Math.floor(t * 30), 1) - 0.5) * shake * 2, sy = (rnd(Math.floor(t * 30), 2) - 0.5) * shake * 2;
  const outGlitch = prog(t, END - 0.55, END - 0.15);
  out.fillStyle = '#000'; out.fillRect(0, 0, W, H);
  if (outGlitch > 0) {
    const n = 24, h = H / n;
    for (let i = 0; i < n; i++) {
      const off = (rnd(i, Math.floor(t * 30)) - 0.5) * 260 * outGlitch * (rnd(i + 3, Math.floor(t * 30)) > 0.5 ? 1 : 0.1);
      out.drawImage(buf, 0, i * h, W, h, off, i * h, W, h);
    }
  } else out.drawImage(buf, sx, sy);
  const fadeOut = prog(t, END - 0.4, END - 0.05);
  if (fadeOut > 0) { out.fillStyle = `rgba(0,0,0,${fadeOut})`; out.fillRect(0, 0, W, H); }
  const fadeIn = 1 - prog(t, 0, 0.35);
  if (fadeIn > 0) { out.fillStyle = `rgba(0,0,0,${fadeIn})`; out.fillRect(0, 0, W, H); }
};
</script>
</body></html>
